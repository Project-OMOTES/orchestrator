[project]
name = "orchestrator"
version = "1.0.0"
description = "FastAPI-based REST API for Omotes job management"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Mark Vrijlandt", email = "mark.vrijlandt@tno.nl" },
    { name = "Cheng-Kai Wang", email = "cheng-kai.wang@tno.nl" },
    { name = "Sebastiaan la Fleur", email = "sebastiaan.lafleur@tno.nl" }
]
keywords = ["omotes", "orchestrator", "rest", "api", "fastapi", "pydantic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]


dependencies = [
    "fastapi[standard]>=0.104.0",
    "jsonschema>=4.0",
    "omotes-sdk-python==5.0.2",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.6",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "ty>=0.0.1a16",
    "httpx>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/omotes/orchestrator"
Repository = "https://github.com/omotes/orchestrator.git"

[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "orchestrator"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=src --cov-report html --cov-report term-missing --cov-fail-under 50"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",
    "F",   # Pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "I",   # isort
    "D",   # pydocstyle
    "ANN", # flake8-annotations
    "DOC", # flake8-docstrings
    "S",   # flake8-bandit
]
ignore = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert statements are standard in tests
"src/orchestrator/settings.py" = ["S104"]  # 0.0.0.0 is intentional for Docker
